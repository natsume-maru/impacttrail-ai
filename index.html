<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A synthetic demo for tracking evidence-backed contributions and milestones.">
  <title>ImpactTrail AI</title>
  <link rel="stylesheet" href="./assets/style.css">
  <script type="module" src="./assets/app.mjs"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to workspace</a>
  <aside class="sidebar">
    <a class="brand" href="#overview"><span class="brand-icon" data-icon="trail"></span><span>ImpactTrail <small>AI</small></span></a>
    <div class="workspace"><span class="workspace-icon">S</span><span><strong>Studio North</strong><small>Synthetic demo</small></span></div>
    <nav aria-label="Workspace" id="navigation"></nav>
    <div class="sidebar-bottom">
      <button id="reset" class="reset" type="button"><span data-icon="reset"></span> Reset demo</button>
      <div class="profile" id="profile"></div>
    </div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <span id="breadcrumb">Workspace / Overview</span>
      <div id="roles" class="roles" role="group" aria-label="Demo perspective">
        <button data-role="employee" type="button">Employee</button>
        <button data-role="manager" type="button">Direct manager</button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="status" class="toast" role="status"></div>
  <dialog id="modal" aria-labelledby="dialog-title"></dialog>
</body>
</html>
